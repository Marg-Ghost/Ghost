<!DOCTYPE html>
<html>
    <head>
        <title>Ghost AI</title>
        <link rel="stylesheet" href="/static/main.css">
    </head>
    <body>
        <section id="sys">
            <h2>Modle: </h2>
            <p>llama3.2:3b</p>
            <h2>Status: </h2>
            <p>active</p>
        </section>
        <main>
            <section id="memory">
                <figure onclick="load_memory('short')">
                    <img src="/static/folder.png">
                    <figcaption>short Memory</figcaption>
                </figure>
                <figure onclick="load_memory('long')">
                    <img src="/static/folder.png">
                    <figcaption>long Memory</figcaption>
                </figure>
            </section>
            <div id="memory-overlay" class="hidden">
                <div id="memory-overlay-content">
                    <button id="memory-close" onclick="close_memory()">✕</button>
                    <h2 id="memory-title">Memory</h2>
                    <pre id="memory-display"></pre>
                </div>
            </div>
            </section>
            <section id="interaction">
                <h1>Ghost ...</h1>
                <p>Welcome {User}</p>
                <textarea id="input" placeholder="Say..."></textarea>
            </section>
            
        </main>
        <section id="answer">
            <h2> > Ghost: </h2>
            <p id="answer_input"></p>
        </section>
        <script src="/static/main.js"></script>
    </body>
</html>>
